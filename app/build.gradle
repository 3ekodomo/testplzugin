plugins {
    id 'com.android.application'
}

android {
    namespace 'org.eu.thedoc.zettelnotes.buttons.imgbb'
    compileSdk 35

    defaultConfig {
        applicationId 'org.eu.thedoc.zettelnotes.buttons.imgbb'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        
        // 3. Explicitly enable multidex
        multiDexEnabled true
    }

    compileOptions {
        // 2. Enable desugaring for older Android compatibility
        coreLibraryDesugaringEnabled true 
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    // 1. Use the stable 2.x Retrofit versions
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    
    // 2. Desugaring library required by the compileOptions block
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
