name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :plugin-btn-imgbb:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imgbb-plugin-release
          path: plugin-btn-imgbb/build/outputs/apk/release/*.apk
          if-no-files-found: error
