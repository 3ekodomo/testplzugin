name: Replace Root With ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-root:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save ZIP outside repository
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 1
          fi

          cp "$ZIP" /tmp/upload.zip
          echo "Saved ZIP to /tmp/upload.zip"

      - name: Clean repository root
        run: |
          # Delete everything from repository root
          # EXCEPT Git metadata and GitHub workflows.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf -- {} +

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/extracted

          unzip -q /tmp/upload.zip -d /tmp/extracted

          # Grant read/write access to the runner so 'cp' can access the files
          chmod -R u+rwX /tmp/extracted

          shopt -s dotglob nullglob
          ITEMS=(/tmp/extracted/*)

          # Remove .github from ZIP if it exists.
          rm -rf /tmp/extracted/.github

          # If ZIP has one top-level directory,
          # put THAT directory's contents in root.
          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -a "${ITEMS[0]}"/. .
          else
            cp -a /tmp/extracted/. .
          fi


      - name: Remove ZIP
        run: |
          rm -f /tmp/upload.zip
          find . -maxdepth 1 -type f -name "*.zip" -delete

      - name: Show final root
        run: |
          echo "===== FINAL REPOSITORY ROOT ====="
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace root with uploaded ZIP contents"
          git push
