name: Replace Root with ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-root:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and save uploaded ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP"

          # Save ZIP outside the repository before cleaning it
          cp "$ZIP" /tmp/upload.zip

      - name: Delete everything except .github
        run: |
          echo "Cleaning repository root..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Repository root cleaned."

      - name: Extract ZIP to repository root
        run: |
          mkdir -p /tmp/zip-extract

          unzip -o /tmp/upload.zip -d /tmp/zip-extract

          shopt -s dotglob nullglob
          ITEMS=(/tmp/zip-extract/*)

          # If ZIP contains one top-level folder,
          # extract that folder's contents instead.
          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="/tmp/zip-extract"
          fi

          # Don't allow ZIP to replace GitHub workflows
          rm -rf "$SOURCE/.github"

          # Copy ZIP contents into repository root
          cp -a "$SOURCE"/. .

      - name: Remove ZIP
        run: |
          rm -f /tmp/upload.zip
          find . -maxdepth 1 -type f -name "*.zip" -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace root with uploaded ZIP contents"
          git push
