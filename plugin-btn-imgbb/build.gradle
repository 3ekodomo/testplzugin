plugins {
    id 'com.android.application'
}

android {
    namespace 'org.eu.thedoc.zettelnotes.buttons.imgbb'
    compileSdk 34

    defaultConfig {
        applicationId 'org.eu.thedoc.zettelnotes.buttons.imgbb'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.appcompat:appcompat:1.7.0"
    
    implementation project(':basemodule')
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    
    // Fix: Force JitPack to build the latest live commit from the master branch
    compileOnly 'com.github.damionx7:Zettel-Notes-Plugin-Api:master-SNAPSHOT'
}
